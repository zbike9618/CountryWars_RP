name: Deploy CountryWars RP to Production

# main に push すると、本番（VM100）の「待ち」に置かれる。配っている RP は、次のサーバーの起動（4時・12時・18時の
# 再起動など）の直前に、本番の sh/run.sh が入れ替える。動いている間に入れ替えると人によって届いたり届かなかったりするため。
# 中身が変わっていれば、manifest.json の版は .github/scripts/install_rp.sh が自動で上げる（手で上げなくてよい）
on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: countrywars-rp-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # OAuth client（Auth Keys: Write, tag:ci）で毎回使い捨ての鍵を作る。BP の deploy.yml と同じ。
      # auth key と違って期限切れにならない（以前の TAILSCALE_AUTHKEY は 2026-08-29 作成で、最長90日で切れる）
      # 192.168.11.0/24 へは CT107 の subnet router 経由で届く（v4 は --accept-routes を自分で付けるので args には書かない）
      - name: Connect to the production network
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci

      # Tailscale が up になっても、すぐには宅内に届かないことがある。SSH のポートに届くまで最大3分待つ
      - name: Wait until the server is reachable
        env:
          HOST: ${{ secrets.PROD_SERVER_IP }}
        run: |
          end=$((SECONDS + 180))
          until timeout 5 bash -c 'exec 3<>"/dev/tcp/$HOST/22"' 2>/dev/null; do
            if [ "$SECONDS" -ge "$end" ]; then
              echo "::error::3分待っても SSH のポートに届きませんでした"
              exit 1
            fi
            echo "まだ届きません。5秒後にもう一度試します"
            sleep 5
          done
          echo "SSH のポートに届きました"

      - name: Package resource pack
        shell: bash
        run: |
          set -euo pipefail
          test -f manifest.json
          test -f texts/ja_JP.lang
          tar \
            --create \
            --gzip \
            --file="$RUNNER_TEMP/CountryWars_RP.tar.gz" \
            --directory="$GITHUB_WORKSPACE" \
            --exclude-vcs \
            --exclude='./.github' \
            --exclude='./README.md' \
            .

          cp "$RUNNER_TEMP/CountryWars_RP.tar.gz" CountryWars_RP.tar.gz
          cp .github/scripts/install_rp.sh countrywars_rp_install.sh

      - name: Upload resource pack to VM100
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.PROD_SERVER_IP }}
          username: root
          key: ${{ secrets.PROD_SSH_KEY }}
          port: 22
          source: CountryWars_RP.tar.gz,countrywars_rp_install.sh
          target: /tmp/
          overwrite: true

      # 待ちへの置き方・版の決め方・入れ替え方は .github/scripts/install_rp.sh の先頭に書いてある
      - name: Stage RP for the next server start and update discord_chat language
        uses: appleboy/ssh-action@v1.0.3
        env:
          RELEASE_ID: ${{ github.sha }}
        with:
          host: ${{ secrets.PROD_SERVER_IP }}
          username: root
          key: ${{ secrets.PROD_SSH_KEY }}
          port: 22
          envs: RELEASE_ID
          command_timeout: 15m
          script: |
            RELEASE_ID="$RELEASE_ID" ARCHIVE=/tmp/CountryWars_RP.tar.gz bash /tmp/countrywars_rp_install.sh stage
